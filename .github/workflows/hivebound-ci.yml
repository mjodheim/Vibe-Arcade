name: Hivebound CI

on:
  push:
    paths:
      - 'games/hivebound/**'
      - 'index.html'
      - 'arcade*.css'
      - 'arcade.js'
      - '.github/workflows/hivebound-ci.yml'
  pull_request:
    paths:
      - 'games/hivebound/**'
      - 'index.html'
      - 'arcade*.css'
      - 'arcade.js'
      - '.github/workflows/hivebound-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check Hivebound server syntax
        working-directory: games/hivebound
        run: node --check server.js
      - name: Check browser scripts
        working-directory: games/hivebound
        run: |
          find public/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check stable 3D world contract
        working-directory: games/hivebound
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync } from 'node:fs';
          const html=readFileSync('public/index.html','utf8');
          const world=readFileSync('public/js/world-engine.js','utf8');
          const polish=readFileSync('public/hive-polish.css','utf8');
          for(const asset of ['world.css','hive-polish.css','js/world-engine.js']) if(!html.includes('/hivebound/'+asset)) throw new Error('index missing '+asset);
          if(html.includes('bee-ambience.js') || html.includes('input-shim.js') || html.includes('/hivebound/js/world.js')) throw new Error('legacy multi-runtime scripts are still loaded');
          if(existsSync('public/js/bee-ambience.js')) throw new Error('second-renderer ambience file still exists');
          const rendererCount=(world.match(/new THREE\.WebGLRenderer/g)||[]).length;
          if(rendererCount!==1) throw new Error('Hivebound must use exactly one WebGLRenderer, found '+rendererCount);
          for(const system of ['function shrine','function resource','function spawnEnemy','function cast','function interact','function renderPanels']) if(!world.includes(system)) throw new Error('world system missing: '+system);
          for(const verb of ['talentPoints','potions','materials','gateOpen','bossDead']) if(!world.includes(verb)) throw new Error('progression contract missing: '+verb);
          for(const camera of ['cameraRig','pointermove','wheel','KeyC','targetDistance']) if(!world.includes(camera)) throw new Error('camera control missing: '+camera);
          for(const perf of ['InstancedMesh','lowQuality','monitorPerformance','webglcontextlost','webglcontextrestored']) if(!world.includes(perf)) throw new Error('stability feature missing: '+perf);
          for(const material of ['noiseTexture','honeyTexture','CanvasTexture','grassTex','waxTex','stoneTex']) if(!world.includes(material)) throw new Error('procedural material missing: '+material);
          if(!polish.includes('.hive-atmosphere') || !polish.includes('gpu-recover')) throw new Error('stable hive presentation styles missing');
          if(html.includes('<small>Q</small><b>🧪')) throw new Error('AZERTY potion label regressed to Q');
          console.log('Hivebound stable engine contract intact: one renderer, orbit camera, instancing, adaptive quality and procedural materials');
          NODE
      - name: Check arcade presentation contract
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const html=readFileSync('index.html','utf8');
          const css=readFileSync('arcade-v2.css','utf8');
          if(!html.includes('/arcade-v2.css')) throw new Error('new arcade presentation stylesheet is not loaded');
          if(html.includes('ACTION ROGUELITE')) throw new Error('Hivebound is still presented as a roguelite');
          for(const copy of ['3D ACTION RPG','Verdant Reach','REALITY FAIL']) if(!html.includes(copy)) throw new Error('arcade presentation missing: '+copy);
          for(const visual of ['.world-card.hive','.hive-city','.preview-swarm','.stack-meteor']) if(!css.includes(visual)) throw new Error('arcade world visual missing: '+visual);
          console.log('Arcade presentation contract intact: two distinct playable worlds');
          NODE
      - name: Run Hivebound tests
        working-directory: games/hivebound
        run: npm test
