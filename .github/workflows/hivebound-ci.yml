name: Hivebound CI

on:
  push:
    paths:
      - 'games/hivebound/**'
      - '.github/workflows/hivebound-ci.yml'
  pull_request:
    paths:
      - 'games/hivebound/**'
      - '.github/workflows/hivebound-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/hivebound
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check server syntax
        run: node --check server.js
      - name: Check browser scripts
        # Everything the game ships, minus the vendored three.js build.
        run: |
          find public/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check the vendored renderer is present
        run: |
          test -f public/vendor/three/three.module.min.js
          test -f public/vendor/three/addons/postprocessing/UnrealBloomPass.js
      - name: Run tests
        run: npm test
