name: Stack Panic CI

on:
  push:
    paths:
      - 'games/stack-panic/**'
      - '.github/workflows/stack-panic-ci.yml'
  pull_request:
    paths:
      - 'games/stack-panic/**'
      - '.github/workflows/stack-panic-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/stack-panic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check game scripts
        run: |
          find public -name '*.js' -not -path 'public/vendor/*' -print0 | xargs -0 -n1 node --check
      - name: Check the vendored renderer is present
        run: test -f public/vendor/three.module.min.js
      - name: Every incident has a soundtrack of its own
        run: |
          node --input-type=module -e "
          import { readFileSync } from 'node:fs';
          const core = readFileSync('public/core.js', 'utf8');
          const music = readFileSync('public/music.js', 'utf8');
          const pool = core.slice(core.indexOf('const EVENT_POOL'), core.indexOf('function emptyBoard'));
          const ids = [...pool.matchAll(/\{id:'([a-z]+)'/g)].map(m => m[1]);
          const tracks = music.slice(music.indexOf('const TRACKS'));
          const missing = ids.filter(id => !new RegExp('\n    ' + id + ': \\{').test(tracks));
          if (!ids.length) { console.error('no incidents found — the parser needs updating'); process.exit(1); }
          if (missing.length) { console.error('incidents without a track: ' + missing.join(', ')); process.exit(1); }
          console.log(ids.length + ' incidents, all scored');
          "
      - name: Check REALITY FAIL contract
        run: |
          node --input-type=module -e "
          import { readFileSync } from 'node:fs';
          const html = readFileSync('public/index.html', 'utf8');
          const controller = readFileSync('public/cataclysms.js', 'utf8');
          const renderer = readFileSync('public/cataclysm-3d.js', 'utf8');
          const css = readFileSync('public/cataclysms.css', 'utf8');
          const requiredTypes = ['blackhole','orbital','sheepstorm'];
          const missingTypes = requiredTypes.filter(id => !controller.includes(\"id:'\" + id + \"'\"));
          if (missingTypes.length) throw new Error('missing cataclysms: ' + missingTypes.join(', '));
          if (!controller.includes('state.chaos>=100')) throw new Error('REALITY FAIL no longer triggers at full chaos');
          if (!controller.includes('targets') || !renderer.includes('targets=[]')) throw new Error('3D/gameplay impact synchronization missing');
          for (const asset of ['cataclysms.css','cataclysms.js','cataclysm-3d.js']) if (!html.includes('/stack-panic/' + asset)) throw new Error('index missing ' + asset);
          if (!renderer.includes(\"import * as THREE from '/stack-panic/vendor/three.module.min.js'\")) throw new Error('cataclysm renderer is not using the vendored Three.js build');
          if (!css.includes('.cabinet.reality-fail')) throw new Error('REALITY FAIL presentation class missing');
          console.log('REALITY FAIL contract intact: 3 cataclysms, 100% trigger, synchronized 3D impacts');
          "
      - name: Check layered incident FX contract
        run: |
          node --input-type=module -e "
          import { readFileSync, existsSync } from 'node:fs';
          const html = readFileSync('public/index.html', 'utf8');
          const css = readFileSync('public/incident-3d.css', 'utf8');
          for (const file of ['public/incident-3d.js','public/incident-3d-hooks.js','public/fx-director.js']) if (!existsSync(file)) throw new Error('missing layered FX file: ' + file);
          for (const asset of ['incident-3d.css','fx-director.js','incident-3d-hooks.js']) if (!html.includes('/stack-panic/' + asset)) throw new Error('index missing ' + asset);
          if (!css.includes('#fxDirector') || !css.includes('.cabinet.fx-lens')) throw new Error('persistent FX / lens grading styles missing');
          const fx = readFileSync('public/fx-director.js','utf8');
          for (const feature of ['acidRain','magnetStorm','wreckHits','scorch','lensPulse']) if (!fx.includes(feature)) throw new Error('FX director missing ' + feature);
          console.log('layered incident FX contract intact');
          "
      - name: Check hostile sabotage contract
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const html=readFileSync('public/index.html','utf8');
          const sabotage=readFileSync('public/sabotage.js','utf8');
          for(const asset of ['sabotage.css','sabotage.js']) if(!html.includes('/stack-panic/'+asset)) throw new Error('index missing '+asset);
          for(const feature of ['RECONFIGURATION NON SOLLICITÉE','scrambleSettledRows','liftBadlyPlacedBlocks','sabotagePulse','12+rand(9)','state.chaos<55']) if(!sabotage.includes(feature)) throw new Error('hostile chaos feature missing: '+feature);
          if(!sabotage.includes('Math.max(72, 590')) throw new Error('gravity difficulty regression');
          if(!sabotage.includes("HEAVY_EVENTS.includes('sheep')")) throw new Error('sheepocalypse no longer classified as heavy sabotage');
          console.log('hostile sabotage contract intact');
          NODE
