<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Vibe Arcade">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101132"/>
      <stop offset=".55" stop-color="#1b1240"/>
      <stop offset="1" stop-color="#07182b"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#plate)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#neon)" stroke-width="10" opacity=".85"/>

  <!-- The two strokes of a V and an A sharing a centre line, drawn like a neon tube. -->
  <g fill="none" stroke="url(#neon)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
    <path d="M124 150 L196 350 L268 150"/>
    <path d="M300 350 L360 150 L420 350"/>
    <path d="M322 286 H398"/>
  </g>
</svg>
