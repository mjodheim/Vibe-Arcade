<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Vibe Arcade animated banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120b2f"/>
      <stop offset="0.45" stop-color="#24124d"/>
      <stop offset="1" stop-color="#071b2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd75e" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffd75e" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hex" width="86" height="74" patternUnits="userSpaceOnUse">
      <path d="M21.5 2h43L86 37 64.5 72h-43L0 37z" fill="none" stroke="#f5b942" stroke-opacity=".09" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="26" fill="url(#hex)"/>
  <ellipse cx="600" cy="170" rx="430" ry="180" fill="url(#glow)">
    <animate attributeName="opacity" values=".45;.9;.45" dur="4.2s" repeatCount="indefinite"/>
  </ellipse>

  <g opacity=".72">
    <circle cx="130" cy="72" r="3" fill="#9bf6ff"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="92" r="4" fill="#ffd75e"><animate attributeName="opacity" values="1;.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="970" cy="282" r="3" fill="#d7a6ff"><animate attributeName="opacity" values=".3;1;.3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="225" cy="285" r="4" fill="#ffd75e"><animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite"/></circle>
  </g>

  <g transform="translate(120 190)" filter="url(#softGlow)">
    <g>
      <ellipse cx="0" cy="0" rx="23" ry="16" fill="#ffd75e"/>
      <rect x="-10" y="-15" width="7" height="30" rx="3" fill="#39250a"/>
      <rect x="5" y="-14" width="7" height="28" rx="3" fill="#39250a"/>
      <circle cx="20" cy="-2" r="9" fill="#ffd75e"/>
      <circle cx="23" cy="-5" r="2.5" fill="#151027"/>
      <ellipse cx="-7" cy="-20" rx="16" ry="9" fill="#dff7ff" fill-opacity=".72" transform="rotate(-26)"/>
      <ellipse cx="5" cy="-20" rx="16" ry="9" fill="#dff7ff" fill-opacity=".72" transform="rotate(26)"/>
      <path d="M-23 0l-16 5 16 5z" fill="#b97b20"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 150 -55; 315 18; 470 -20; 0 0" dur="10s" repeatCount="indefinite"/>
    </g>
  </g>

  <g transform="translate(1030 245) scale(.72)" opacity=".9">
    <g>
      <ellipse cx="0" cy="0" rx="23" ry="16" fill="#ffd75e"/>
      <rect x="-10" y="-15" width="7" height="30" rx="3" fill="#39250a"/>
      <rect x="5" y="-14" width="7" height="28" rx="3" fill="#39250a"/>
      <circle cx="20" cy="-2" r="9" fill="#ffd75e"/>
      <ellipse cx="-7" cy="-20" rx="16" ry="9" fill="#dff7ff" fill-opacity=".65"/>
      <ellipse cx="5" cy="-20" rx="16" ry="9" fill="#dff7ff" fill-opacity=".65"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-130 30;-260 -15;-390 25;0 0" dur="12s" repeatCount="indefinite"/>
    </g>
  </g>

  <text x="600" y="135" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="74" font-weight="800" letter-spacing="8" fill="#fff7d6" filter="url(#textGlow)">VIBE ARCADE</text>
  <text x="600" y="190" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="25" font-weight="700" letter-spacing="3" fill="#ffd75e">IDEAS IN · GAMES OUT</text>
  <text x="600" y="238" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="18" fill="#c9d7ff">A growing collection of games shaped through vibe coding</text>

  <g transform="translate(600 300)">
    <rect x="-105" y="-24" width="210" height="48" rx="24" fill="#ffd75e" opacity=".96">
      <animate attributeName="opacity" values=".82;1;.82" dur="1.7s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="7" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="18" font-weight="800" fill="#261638">▶ INSERT IDEA</text>
  </g>
</svg>